version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/render"
    schedule:
      interval: weekly
    groups:
      torch:
        patterns: ["torch", "torchvision"]
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
