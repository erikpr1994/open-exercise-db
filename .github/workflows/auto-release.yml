name: Auto release

# Every merge to main that changes the shipped data publishes a patch
# release automatically. Minor and major versions are still cut by hand
# by pushing a v* tag (see release.yml); tags created here use the
# built-in GITHUB_TOKEN, which GitHub never lets re-trigger release.yml,
# so the two workflows cannot double-publish.

on:
  push:
    branches: [main]
    paths:
      - "exercises/**"
      - "families/**"
      - "vocab/**"
      - "schema/**"
      - "removed-exercises.json"
      - "scripts/build.mjs"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release (vX.Y.Z), for minor/major bumps; leave empty for the next patch"
        required: false

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to compute the next version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - name: Skip when the built data matches the latest release
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=true
          if gh release download --pattern "exercises.json" --pattern "families.json" --dir released 2>/dev/null; then
            if cmp -s dist/exercises.json released/exercises.json &&
              cmp -s dist/families.json released/families.json; then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Compute the next version
        if: steps.diff.outputs.changed == 'true' || inputs.version != ''
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            echo "$REQUESTED" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' ||
              { echo "version must look like vX.Y.Z, got: $REQUESTED" >&2; exit 1; }
            next="$REQUESTED"
          else
            latest=$(git tag --list "v*" --sort=-v:refname | head -n1)
            bump=patch
            if [ -f released/exercises.json ]; then
              bump=$(node -e '
                const { readFileSync } = require("node:fs");
                const released = JSON.parse(readFileSync("released/exercises.json", "utf8"));
                const current = new Set(
                  JSON.parse(readFileSync("dist/exercises.json", "utf8")).map((e) => e.id),
                );
                console.log(released.some((e) => !current.has(e.id)) ? "minor" : "patch");
              ')
            fi
            next=$(node -e '
              const [major, minor, patch] = process.argv[1].replace(/^v/, "").split(".").map(Number);
              console.log(
                process.argv[2] === "minor" ? `v${major}.${minor + 1}.0` : `v${major}.${minor}.${patch + 1}`,
              );
            ' "${latest:-v0.0.0}" "$bump")
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - name: Generate the data changelog
        if: steps.diff.outputs.changed == 'true' || inputs.version != ''
        run: node scripts/release-notes.mjs > release-notes.md
      - name: Create the release
        if: steps.diff.outputs.changed == 'true' || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.version.outputs.next }}"
          dist/exercises.json dist/families.json
          --title "${{ steps.version.outputs.next }}"
          --notes-file release-notes.md
          --generate-notes
      - name: Notify Peak Health of the new release
        if: steps.diff.outputs.changed == 'true' || inputs.version != ''
        # Cross-repo issue creation needs a token scoped to peakhealth —
        # the built-in GITHUB_TOKEN only reaches this repo. Without
        # PEAKHEALTH_SYNC_TOKEN configured (Settings > Secrets and
        # variables > Actions), this step fails but the release above has
        # already published, so a missing secret never blocks a release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PEAKHEALTH_SYNC_TOKEN }}
          TAG: ${{ steps.version.outputs.next }}
        run: |
          node scripts/notify-peakhealth.mjs "$TAG" "https://github.com/erikpr1994/open-exercise-db/releases/tag/$TAG" > issue-body.md
          gh issue create --repo erikpr1994/peakhealth \
            --title "Sync exercise catalogue to open-exercise-db $TAG" \
            --label ready-for-agent \
            --body-file issue-body.md
