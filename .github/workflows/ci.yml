name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: npm test
      - name: Check compatibility with the latest release
        run: node scripts/check-release-compat.mjs
      - name: Check that the issue form matches schema and vocab
        run: |
          npm run generate-issue-form
          git diff --exit-code -- .github/ISSUE_TEMPLATE/new-exercise.yml
